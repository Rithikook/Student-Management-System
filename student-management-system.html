<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg: #0d0f14; --surface: #13161e; --card: #1a1e2a; --border: #252a38;
      --accent: #4f8ef7; --accent-glow: rgba(79,142,247,0.18); --accent2: #f7964f;
      --green: #3ecf8e; --red: #f7514f; --text: #e8ecf5; --muted: #6b7390;
      --radius: 12px; --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; min-height: 100vh; }
    .wrapper { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .header-left h1 { font-family: var(--font-head); font-size: 26px; font-weight: 800; }
    .header-left h1 span { color: var(--accent); }
    .stats { display: flex; gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; flex: 1; }
    .stat-card .label { font-size: 11px; text-transform: uppercase; color: var(--muted); }
    .stat-card .value { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--accent); }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: var(--surface); color: var(--muted); padding: 14px; text-align: left; font-size: 11px; text-transform: uppercase; }
    tbody td { padding: 14px; border-top: 1px solid var(--border); }
    button { cursor: pointer; border-radius: 8px; font-weight: 500; border: none; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: white; padding: 10px 20px; }
    .btn-danger { background: rgba(247,81,79,0.1); color: var(--red); padding: 6px 12px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card); padding: 30px; border-radius: 16px; width: 400px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    input { background: var(--surface); border: 1px solid var(--border); padding: 10px; color: white; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="header-left">
        <h1>Student <span>Management</span></h1>
        <p>Dashboard Overview</p>
      </div>
      <button class="btn-primary" onclick="toggleModal()">+ Add Student</button>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Students</div>
        <div class="value" id="studentCount">0</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Course</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- Students will appear here -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 style="margin-bottom:20px">Add New <span>Student</span></h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="nameInput" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="rollInput" placeholder="2024-001">
      </div>
      <div class="form-group">
        <label>Course</label>
        <input type="text" id="courseInput" placeholder="Computer Science">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn-primary" style="flex:1" onclick="addStudent()">Save Student</button>
        <button onclick="toggleModal()" style="background:none; color:var(--muted)">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let students = [];

    function toggleModal() {
      const modal = document.getElementById('modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function addStudent() {
      const name = document.getElementById('nameInput').value;
      const roll = document.getElementById('rollInput').value;
      const course = document.getElementById('courseInput').value;

      if(name && roll && course) {
        students.push({ name, roll, course });
        updateTable();
        toggleModal();
        // Clear inputs
        document.getElementById('nameInput').value = '';
        document.getElementById('rollInput').value = '';
        document.getElementById('courseInput').value = '';
      } else {
        alert("Please fill in all fields");
      }
    }

    function deleteStudent(index) {
      students.splice(index, 1);
      updateTable();
    }

    function updateTable() {
      const tbody = document.getElementById('studentTableBody');
      const count = document.getElementById('studentCount');
      tbody.innerHTML = '';
      
      students.forEach((s, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${s.name}</td>
            <td>${s.roll}</td>
            <td><span style="color:var(--accent)">${s.course}</span></td>
            <td><button class="btn-danger" onclick="deleteStudent(${index})">Delete</button></td>
          </tr>
        `;
      });
      count.innerText = students.length;
    }
  </script>
</body>
</html>
